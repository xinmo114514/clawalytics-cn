name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Enable pinned pnpm
        run: corepack enable && corepack install --global pnpm@10.32.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile uses HTTPS package sources
        shell: bash
        run: '! rg -n "git@github|git\\+ssh|ssh://" pnpm-lock.yaml'
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Analytics regressions
        run: pnpm test:analytics
      - name: Hermes regressions
        run: pnpm test:hermes
      - name: OpenClaw regressions
        run: pnpm test:openclaw
      - name: Security boundary
        run: pnpm test:security-boundary
      - name: Request trust policy
        run: pnpm test:request-trust
      - name: Electron security policy
        run: pnpm test:desktop-security
      - name: Pairing synchronization
        run: pnpm test:pairing-sync
      - name: Input safety
        run: pnpm test:input-safety
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org
  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Enable pinned pnpm
        shell: pwsh
        run: corepack enable; corepack install --global pnpm@10.32.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Analytics regressions
        run: pnpm test:analytics
      - name: Hermes regressions
        run: pnpm test:hermes
      - name: OpenClaw regressions
        run: pnpm test:openclaw
      - name: Desktop notifications
        run: pnpm test:desktop-notifications
      - name: Server binding
        run: pnpm test:server-binding
      - name: Security boundary
        run: pnpm test:security-boundary
      - name: Request trust policy
        run: pnpm test:request-trust
      - name: Electron security policy
        run: pnpm test:desktop-security
      - name: Pairing synchronization
        run: pnpm test:pairing-sync
      - name: Input safety
        run: pnpm test:input-safety
      - name: WSL platform helper
        run: pnpm test:wsl-platform
      - name: Build unpacked Windows directory only
        env:
          CLAWALYTICS_DIRECTORY_BUILD: '1'
        run: pnpm exec electron-builder --win dir --config.win.signAndEditExecutable=false
      - name: Electron desktop E2E
        run: pnpm test:desktop-e2e
