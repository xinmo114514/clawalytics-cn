<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.ico"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.ico"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.ico"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.ico"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Clawalytics Dashboard</title>
    <meta name="title" content="Clawalytics Dashboard" />
    <meta
      name="description"
      content="Track your OpenClaw AI spending in real-time."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clawalytics Dashboard" />
    <meta
      property="og:description"
      content="Track your OpenClaw AI spending in real-time."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Clawalytics Dashboard" />
    <meta
      property="twitter:description"
      content="Track your OpenClaw AI spending in real-time."
    />

    <!-- 字体已本地化（public/fonts + styles/fonts.css），不依赖任何外网，代理/VPN 状态不再影响启动渲染 -->
    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
